name: SOP validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q --basetemp .pytest-tmp/current-run
      - name: Validate static contracts
        run: python scripts/validate-static-contracts.py
      - name: Run CLI smoke
        run: python -m sop --root . project list
      - name: Run hook launcher smoke
        run: node .cursor/hooks/session-start.mjs

  windows-unified-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt
      - name: Run unified SOP validation
        shell: pwsh
        run: ./scripts/tests/run-sop-validation.ps1
